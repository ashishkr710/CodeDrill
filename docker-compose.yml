services:
  mongodb:
    image: mongo:7.0
    container_name: codedrill-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  judge0-db:
    image: postgres:16-alpine
    container_name: codedrill-judge0-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    container_name: codedrill-judge0-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - judge0-redis-data:/data

  judge0-server:
    image: judge0/judge0:v1.13.1
    container_name: codedrill-judge0-server
    restart: unless-stopped
    privileged: true
    ports:
      - '2358:2358'
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://judge0-redis:6379/0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
    depends_on:
      - judge0-db
      - judge0-redis

  backend:
    build:
      context: ./codedrill-backend
      dockerfile: Dockerfile
    container_name: codedrill-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
      MONGODB_URI: mongodb://mongodb:27017/codedrill
      JWT_ACCESS_SECRET: codedrill_super_secret_access_jwt_key_production_32chars!
      JWT_REFRESH_SECRET: codedrill_super_secret_refresh_jwt_key_production_32chars!
      EXECUTION_SANDBOX_TYPE: mock
      JUDGE0_API_URL: http://judge0-server:2358
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./codedrill-frontend
      dockerfile: Dockerfile
    container_name: codedrill-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  mongo-data:
  judge0-postgres-data:
  judge0-redis-data:
